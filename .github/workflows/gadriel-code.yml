#
# L4 — Full repo scan. Manual / on-demand only by default: run it from
# the Actions tab ("Run workflow") or `gh workflow run "Gadriel Security
# Scan"`. To enable automated runs, add an `on:` trigger such as
# `pull_request:` or `push: { branches: [main] }`.

name: Gadriel Security Scan

on:
  workflow_dispatch:

jobs:
  gadriel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # ADR-077 Decision 8 — git-history sweep requires full clone.
          fetch-depth: 0

      - name: Install Gadriel
        run: cargo install gadriel-cli

      - name: Run Gadriel L4 scan
        run: |
          mkdir -p findings
          gadriel code scan \
            --layer l4 \
            --output findings/findings.json \
            --output-format ocsf

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: gadriel-findings
          path: findings/

      - name: Enforce verdict
        run: |
          if grep -q '"verdict": "FAIL"' findings/findings.json; then
            echo "::error::Gadriel verdict: FAIL"
            exit 1
          fi
